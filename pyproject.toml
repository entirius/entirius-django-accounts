[project]
name = "entirius-django-accounts"
version = "5.0.0"
description = "Accounts Django module for Volkanos"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "Django>=4.0.0",
    "django-allauth[socialaccount]>=0.45.0",
    "django-admin-inline-paginator>=0.4",
    "djangorestframework>=3.12.4",
    "djangorestframework-simplejwt>=4.7.2",
    "drf-spectacular>=0.27.0",
    "marshmallow>=3.15.0",
    "marshmallow-dataclass>=8.5.3",
    "pydantic>=2.0",
    "PyJWT>=2.3.0",
    "requests>=2.25.0",
    "tqdm>=4.65.0",
    "entirius-py-idx-normalizator>=2.0.0",
    "entirius-py-int-enum-choices>=2.0.0",
    "entirius-py-process-logger>=2.0.0",
    "entirius-django-email>=4.0.0",
    "entirius-django-regional>=2.0.1",
    "entirius-django-utils>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = [
    "pytest",
    "pytest-django",
    "dj-database-url",
    "psycopg[binary]",
    "entirius-django-captcha>=2.0.0",
]
# Optional PIM integration: lazy import in the product-representation worker only.
pim = ["entirius-django-pim>=3.0.0"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-accounts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_accounts"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106"]
# Legacy migrated 1:1
"src/django_accounts/models/**" = ["B026", "B904", "DJ001", "DJ008", "DJ012", "E722"]
"src/django_accounts/views/**" = ["B008", "B904", "C408", "E402", "F841", "S105", "S110", "S113"]
"src/django_accounts/utils/**" = ["B026", "B904", "C408", "E731"]
"src/django_accounts/workers/**" = ["B904", "F401"]
"src/django_accounts/services/accounts_service.py" = ["B905"]
"src/django_accounts/dto/wishlist.py" = ["E731"]
"src/django_accounts/backends.py" = ["B904"]
"src/django_accounts/jwt.py" = ["F841"]
# F509: latent bug in get_help_text ("%(number_of_symbols)" lacks a conversion) — fix upstream-first
"src/django_accounts/password_validators.py" = ["C416", "F509"]

[tool.ruff.lint.isort]
known-first-party = ["django_accounts"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--reuse-db"

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# Lazy feature-flag import (pim extra): worker raises a clear error when the extra is absent.
DEP001 = ["django_pim"]
